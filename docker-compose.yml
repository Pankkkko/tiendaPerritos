version: '3.8'

services:
  # Servicio de Base de Datos MySQL
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: tienda-perritos-db
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: tienda_perritos
      MYSQL_USER: alumno
      MYSQL_PASSWORD: alumno123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tienda-network

  # Servicio Backend (Node.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tienda-perritos-backend
    environment:
      DB_HOST: db
      DB_USER: alumno
      DB_PASSWORD: alumno123
      DB_NAME: tienda_perritos
      DB_PORT: 3306
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tienda-network
    restart: unless-stopped

  # Servicio Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tienda-perritos-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tienda-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  tienda-network:
    driver: bridge
